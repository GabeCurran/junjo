# Publish packages to npm via changesets.
#
# MANUAL TRIGGER ONLY (workflow_dispatch). Packages publish under the
# @junjo-io scope (the bare "junjo" npm name could not be secured; the
# scope matches the owned junjo.io domain). The npm org "junjo-io" must
# exist and the NPM_TOKEN repository secret must be a token authorized to
# publish to it. See PUBLISH.md at the repo root for the owner runbook.
#
# id-token: write + NPM_CONFIG_PROVENANCE enable npm provenance
# attestation.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
