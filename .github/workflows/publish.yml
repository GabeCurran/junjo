# Publish packages to npm.
#
# MANUAL TRIGGER ONLY (workflow_dispatch). Packages publish under the
# @junjo.io scope. Auth is npm TRUSTED PUBLISHING (OIDC): each package's
# npm settings page lists this repo + workflow as a trusted publisher, so
# no NPM_TOKEN secret is needed and provenance attestation is automatic
# (requires npm >= 11.5, hence the explicit npm upgrade step).
#
# Publishes every publishable workspace whose version is not yet on the
# registry; already-published versions are skipped, so the job is safe to
# re-run. Bump versions in the package.json files, push, then dispatch.

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm (OIDC exchange support).
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish (skips versions already on the registry)
        run: |
          for pkg in "@junjo.io/shared" "@junjo.io/sdk" "@junjo.io/react"; do
            version=$(npm pkg get version --workspace "$pkg" | node -e "const o=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(Object.values(o)[0])")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already published, skipping"
            else
              npm publish --workspace "$pkg" --access public --provenance
            fi
          done
