# Junjo Java SDK: wrapper validation, build, unit tests and the shared
# permission conformance vectors.
#
# The SDK targets Java 21 (`options.release = 21`), so the floor JDK is
# tested alongside the newest LTS. The Windows leg covers the
# `gradlew.bat` entry point and path handling. Live integration tests
# skip themselves here: they need a running Junjo server, which this
# workflow does not start.

name: Java SDK

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-java/**"
      - "packages/shared/conformance/**"
      - ".github/workflows/java.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/sdk-java/**"
      - "packages/shared/conformance/**"
      - ".github/workflows/java.yml"

jobs:
  build-test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "21"
          - os: ubuntu-latest
            java: "25"
          - os: windows-2022
            java: "21"
    defaults:
      run:
        working-directory: packages/sdk-java
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Refuses a wrapper jar that does not match a published Gradle
      # release before anything executes it.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build and test
        run: ./gradlew --no-daemon build
